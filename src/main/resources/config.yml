# =====================================================================
#   RadiantEngine - configuracion
#   Coloca tus archivos .bbmodel en plugins/RadiantEngine/blueprints/
#   (se admiten subcarpetas) y usa /radiant reload para importarlos.
#   Todos los textos usan MiniMessage: https://docs.advntr.dev/minimessage/format
# =====================================================================

# Namespace usado dentro del resource pack (assets/<namespace>/...)
namespace: radiantengine
debug: false

generator:
  # Item base sobre el que se registran los modelos. Debe ser tintable (cuero) para que el tinte funcione.
  base-item: LEATHER_HORSE_ARMOR
  # Primer CustomModelData asignado. Los IDs se guardan en cmd-cache.yml para que sean estables.
  custom-model-data-start: 10000
  # Genera resource_pack.zip ademas de la carpeta resource_pack/
  create-zip: true
  pack-description: "RadiantEngine resource pack"
  # Rango maximo (en pixeles desde el pivote) antes de reducir el modelo JSON y compensar con escala.
  max-element-extent: 24.0
  # 1.21.4+: asigna a cada item el componente item_model con su propia definicion (assets/<namespace>/items/...).
  # Evita el cuadro rosa/negro cuando otro plugin (p. ej. Oraxen) cambia el item base. Los clientes antiguos usan el CMD.
  use-item-model: true

render:
  # Ticks de interpolacion nativa de la Transformation de cada hueso (1-3 recomendado)
  interpolation-ticks: 2
  # Ticks de interpolacion de teletransporte de las Display Entities
  teleport-ticks: 2
  # Multiplicador de distancia de vision de los displays (1.0 = 64 bloques)
  view-range: 1.0
  # Distancia minima de movimiento antes de reenviar posiciones
  move-threshold: 0.0005

oraxen:
  # Si Oraxen esta instalado, exporta los huesos como items de Oraxen y copia los assets a su pack.
  enabled: true
  items-file: radiantengine_models.yml
  # Construir los items de los huesos con OraxenItems.getItemById(...). Normalmente no hace falta: RadiantEngine
  # genera sus propios items. Aunque se active, el CustomModelData y el item_model siempre apuntan a los de RadiantEngine.
  use-oraxen-items: false
  # Comando ejecutado cuando cambian los assets exportados (vacio = no ejecutar nada)
  reload-command: "oraxen reload all"

model:
  damage-tint: true
  damage-tint-color: "FF6B6B"
  damage-tint-ticks: 6
  # Giro maximo de huesos h_ (cabeza) respecto al cuerpo, en grados
  head-max-yaw: 75.0
  # Velocidad horizontal (bloques/tick) a partir de la cual se considera que camina
  walk-threshold: 0.015
  # Crea una Interaction con el tamaño del hueso "hitbox" del modelo
  main-hitbox: true
  # Si el modelo tiene huesos tag_, oculta el nombre vanilla de la entidad base
  hide-vanilla-name-with-tag: true

# Estados automaticos -> animacion de Blockbench que se reproduce
states:
  idle:   { animation: idle,   lerp-in: 0.25, lerp-out: 0.25, speed: 1.0 }
  walk:   { animation: walk,   lerp-in: 0.25, lerp-out: 0.25, speed: 1.0 }
  jump:   { animation: jump,   lerp-in: 0.15, lerp-out: 0.15, speed: 1.0 }
  fly:    { animation: fly,    lerp-in: 0.25, lerp-out: 0.25, speed: 1.0 }
  attack: { animation: attack, lerp-in: 0.05, lerp-out: 0.15, speed: 1.0 }
  death:  { animation: death,  lerp-in: 0.15, lerp-out: 0.0,  speed: 1.0 }
  spawn:  { animation: spawn,  lerp-in: 0.0,  lerp-out: 0.25, speed: 1.0 }

spawn:
  # Entidad base usada por /radiant spawn cuando no se indica otra
  default-entity: husk
  silent: false
  # Hace invisible la entidad base (el modelo la sustituye visualmente)
  hide-base: true
  clear-equipment: true
  # Varias instancias: /radiant spawn <modelo> [entidad] [cantidad] [radio] y /radiant summon <modelo> [cantidad] [radio]
  # (tambien count:N y spread:R en cualquier posicion, p. ej. /radiant summon estatua ~ ~ ~ count:6 spread:4)
  multi:
    # Maximo de instancias por comando (evita spawns gigantes por error). La API no aplica este limite.
    max-count: 50
    # Radio maximo permitido en los comandos (bloques)
    max-spread: 64.0
    # Radio usado cuando cantidad > 1 y no se indica radio
    default-spread: 2.0
    # Separacion minima entre instancias; el radio crece si es demasiado pequeño para la cantidad
    min-spacing: 0.8
    # Colocar cada instancia sobre suelo seguro cercano (bloque solido debajo, 2 bloques libres, sin lava)
    safe-ground: true

disguise:
  # Como ve el jugador disfrazado su propio modelo:
  #   HEADLESS = todo menos los huesos h_ (cabeza) y nametags: completo en F5 y sin tapar la primera persona
  #   FULL     = modelo completo
  #   NONE     = oculto para el propio jugador
  # Cada jugador puede cambiarlo con /radiant selfview <full|headless|none>
  self-view: HEADLESS
  # INVISIBILITY (efecto de pocion) o HIDE (oculta la entidad del jugador a los demas)
  hide-mode: INVISIBILITY
  # Restaurar el disfraz al reconectar
  persist: true

mount:
  # Valores base de conduccion. Los perfiles por modelo (GROUND, FLYING, SWIMMING, AMPHIBIOUS, banking...)
  # estan en plugins/RadiantEngine/mounts.yml.
  speed: 0.28
  jump-strength: 0.55
  # Desplazamiento vertical del asiento respecto al hueso p_/mount
  seat-offset-y: -0.4
  # Click derecho sobre un modelo con asientos libres para montar
  right-click-to-mount: false

npc:
  # Oculta el NPC original (Citizens: invisibilidad; FancyNpcs/ZNPCsPlus: no se envia la entidad de paquetes)
  hide-original: true
  # Cada cuantos ticks se revisan los NPCs (posicion, chunk cargado, modelo presente)
  sync-interval: 20

holograms:
  # Valores usados al crear un holograma (cada holograma guarda los suyos en holograms.yml)
  defaults:
    # Grados por segundo en modo SPIN
    spin-speed: 30.0
    # Flotacion senoidal (bloques) y duracion de un ciclo (segundos)
    bob-amplitude: 0.08
    bob-period: 3.0
    # Altura del modelo sobre el punto del pedestal
    float-height: 0.35
    # Tinte holografico (RRGGBB) o "" para los colores originales
    tint: "7FE9FF"
    # Brillo maximo (Brightness 15/15) para que no dependa de la luz del mundo
    fullbright: true
    # Contorno brillante y su color
    glowing: false
    glow-color: "00E5FF"
    ring:
      enabled: true
      # Particula del anillo del pedestal (end_rod, electric_spark, dust, soul_fire_flame...)
      particle: end_rod
      radius: 0.6
      points: 18
      # Cada cuantos ticks se dibuja
      interval: 10
  # Separacion del texto respecto al modelo
  text-offset: 0.3
  # Cada cuantos ticks se actualizan los placeholders del texto
  text-refresh-ticks: 20
  # Tiempo minimo entre clics de un jugador
  click-cooldown-ms: 500

pets:
  # true = solo las mascotas definidas en pets.yml; false = cualquier modelo (con permiso o asignacion)
  only-defined: false
  default-movement: WALK
  speed: 0.24
  sprint-speed: 0.42
  follow-distance: 2.2
  fly-height: 1.5
  # Distancia a la que la mascota deja de acercarse
  stop-distance: 1.2
  # Si se aleja mas, se teletransporta junto al dueño
  teleport-distance: 24
  hide-while-disguised: false
  # Mascotas como vehiculo (pets.yml: rideable: true y mount-profile opcional)
  ride:
    # Valor de 'rideable' para mascotas sin definicion en pets.yml
    default-rideable: false
    # El dueño monta su mascota haciendo click derecho sobre ella
    interact: true
    # Otros jugadores pueden subir como pasajeros (huesos p_) mientras el dueño la conduce
    allow-passengers: true
  # Animaciones de Blockbench usadas segun el estado del dueño
  animations:
    idle: idle
    walk: walk
    sprint: sprint
    jump: jump
    fly: fly
    owner-attack: owner_attack
    owner-hurt: owner_hurt

cosmetics:
  only-defined: false
  # Anclaje para modelos no definidos en cosmetics.yml: BACK, HEAD u ORBIT
  default-anchor: BACK
  # Maximo de cosmeticos equipados a la vez (uno por anclaje salvo ORBIT)
  max-equipped: 4
  hide-while-disguised: true
  hide-when-invisible: true
  animations:
    idle: idle
    walk: walk
    sprint: sprint
    jump: jump
    fly: fly

bedrock:
  # Soporte Geyser/Floodgate (deteccion por reflexion, no requiere dependencias)
  enabled: true
  # Genera plugins/RadiantEngine/bedrock_pack/ y bedrock_pack.mcpack en cada reload
  generate-pack: true
  # Oculta a los jugadores Bedrock los rigs con mas huesos renderizables que max-render-bones
  hide-heavy-rigs: false
  max-render-bones: 24
  # Reduce (a 1/4) las particulas de animaciones y hologramas para jugadores Bedrock
  reduce-particles: true
  particle-distance: 48
  # Ajustes para las mascotas/cosmeticos de jugadores Bedrock
  pet-scale: 1.0
  cosmetic-scale: 1.0
  cosmetic-offset-y: 0.0
  # Vista del propio disfraz para jugadores Bedrock (FULL, HEADLESS o NONE)
  disguise-self-view: NONE
  # Sin Floodgate/Geyser: considerar Bedrock los UUID que empiezan por 00000000-0000-0000
  detect-by-uuid-prefix: false

branding:
  # Logo usado en el resource pack, el menu y el pack Bedrock.
  # Si existe uno de los archivos de logo-files se usa ese; si no, el logo de RadiantEngine incluido en el plugin.
  enabled: true
  # Usar el logo de RadiantEngine incluido en el plugin cuando no hay logo personalizado
  # (false = icono generado simple)
  use-default-logo: true
  # Archivos buscados en orden, relativos a plugins/RadiantEngine/ (PNG, JPG, GIF o BMP; max 16 MB / 8192 px)
  logo-files:
    - logo.png
    - assets/logo.png
    - branding/logo.png
  # Icono del pack (pack.png de Java y pack_icon.png de Bedrock). Tamaño en px (potencia de 2, 16-512)
  pack-icon: true
  pack-icon-size: 256
  # Dibuja el logo en la cabecera del fondo de los menus (altura en px, 4-13)
  menu-header: true
  menu-logo-height: 12
  # Item con el logo para los botones de informacion de los menus (textura en px, potencia de 2, 16-256)
  gui-item: true
  item-size: 64
  # Sustituir tambien plugins/Oraxen/pack/pack.png por tu logo (cambia el icono del pack de Oraxen)
  oraxen-pack-icon: false

worldguard:
  # Mensajes cuando un flag bloquea una accion. Flags: radiant-allow-spawn, radiant-allow-mounts
  enabled: true

placeholderapi:
  # Texto devuelto cuando no hay disfraz / montura
  none: "ninguno"

# Vincula huesos item_/ir_/il_/ih_ a un item.  "<modelo>.<hueso>": "oraxen:<id>" | "minecraft:<material>"
item-links:
  example_model.sword: "minecraft:diamond_sword"

scripts:
  # Permite keyframes de timeline "cmd:<comando>" en las animaciones
  allow-commands: true

gui:
  # Fondo personalizado dibujado con una fuente del resource pack (requiere Paper y el pack cargado)
  custom-texture: true
  textured-title: "<white>Modelos</white> <dark_gray>»</dark_gray> <aqua>{page}</aqua><gray>/</gray><aqua>{pages}</aqua>"
  # Titulo usado sin textura personalizada (Spigot o custom-texture: false)
  title: "<dark_gray>Modelos</dark_gray> <gray>({page}/{pages})</gray>"
  use-model-icons: true
  preview-seconds: 10

